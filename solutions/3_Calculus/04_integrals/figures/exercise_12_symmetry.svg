<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-label="Signed areas under y equals x and positive areas under y equals absolute value x from minus two to two"><title>Symmetry and signed area on minus two to two</title><rect width="100%" height="100%" fill="white"/><style>text{font:15px sans-serif;fill:#172033}.axis{stroke:#39465e;stroke-width:1.5}.line{fill:none;stroke:#1769aa;stroke-width:3}.tick{stroke:#39465e;stroke-width:1.2}</style>
<text x="65" y="30" style="font-weight:bold;font-size:18px">y = x: equal signed areas cancel</text><text x="505" y="30" style="font-weight:bold;font-size:18px">y = |x|: areas add</text>
