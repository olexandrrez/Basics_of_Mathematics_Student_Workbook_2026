<!-- right panel -->
<path d="M500 210H860 M680 55V355" class="axis"/><path d="M560 120 L680 210 L800 120" class="line"/>
<path d="M560 120 L680 210 L560 210 Z" fill="#8bc89c" opacity=".65"/><path d="M680 210 L800 120 L800 210 Z" fill="#8bc89c" opacity=".65"/>
<path d="M560 205V215 M800 205V215" class="tick"/><text x="552" y="235">−2</text><text x="794" y="235">2</text><text x="545" y="105">area 2</text><text x="777" y="105">area 2</text><text x="841" y="204">x</text><text x="687" y="68">y</text></svg>