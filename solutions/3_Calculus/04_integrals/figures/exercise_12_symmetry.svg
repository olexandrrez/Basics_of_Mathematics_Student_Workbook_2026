<path d="M60 210H420 M240 55V355" class="axis"/><path d="M120 300 L240 210 L360 120" class="line"/>
<path d="M120 300 L240 210 L120 210 Z" fill="#e7a4a4" opacity=".6"/><path d="M240 210 L360 120 L360 210 Z" fill="#8bc89c" opacity=".65"/>
