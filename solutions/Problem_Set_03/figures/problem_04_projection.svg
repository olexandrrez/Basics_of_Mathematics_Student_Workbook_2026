<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img" aria-label="Vector v and its orthogonal projection onto u"><title>Orthogonal projection of v onto direction u</title><rect width="100%" height="100%" fill="white"/><style>text{font:15px sans-serif;fill:#172033}.v{fill:none;stroke-width:3}</style><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><path d="M70 225 H455" stroke="#455268" stroke-width="2" marker-end="url(#arr)"/><text x="462" y="232">direction u=(1,2,2)</text><path class="v" d="M70 225 L300 225" stroke="#25855a" marker-end="url(#arr)"/><text x="160" y="250" fill="#25855a">projᵤ(v)=(1,2,2)</text><path class="v" d="M70 225 L300 75" stroke="#1769aa" marker-end="url(#arr)"/><text x="275" y="69" fill="#1769aa">v=(3,1,2)</text><path d="M300 75 V225" stroke="#8993a3" stroke-dasharray="6 5" stroke-width="2"/><path d="M300 225 h16 v-16" fill="none" stroke="#455268" stroke-width="1.5"/><text x="63" y="247">O</text><text x="176" y="203">scalar component = 3</text><text x="260" y="282" font-size="12">Schematic: the drawing illustrates orthogonality, not 3D coordinate scale.</text></svg>