<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360" viewBox="0 0 560 360" role="img" aria-label="Skew lines L and M, parallel line N, and their shortest connector"><title>L and M are skew at distance one; N is parallel to L</title><rect width="100%" height="100%" fill="white"/><style>text{font:14px sans-serif;fill:#172033}.line{fill:none;stroke-width:3}</style><defs><marker id="arrL" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1769aa"/></marker><marker id="arrM" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#bd4a3c"/></marker><marker id="arrN" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#25855a"/></marker></defs><path d="M95 280 L160 255" stroke="#68758a" stroke-width="1.5"/><text x="64" y="292">y direction</text><path class="line" d="M95 280 H440" stroke="#1769aa" marker-end="url(#arrL)"/><text x="440" y="272" fill="#1769aa">L: (t,0,0)</text><path class="line" d="M160 255 V65" stroke="#bd4a3c" marker-end="url(#arrM)"/><text x="170" y="72" fill="#bd4a3c">M: (0,1,s)</text><path class="line" d="M160 255 H500" stroke="#25855a" marker-end="url(#arrN)"/><text x="420" y="248" fill="#25855a">N: (r,1,0), parallel to L</text><path d="M95 280 L160 255" stroke="#d08a16" stroke-width="3" stroke-dasharray="7 5"/><text x="104" y="243" fill="#a36a0a">shortest distance = 1</text><circle cx="95" cy="280" r="4" fill="#172033"/><circle cx="160" cy="255" r="4" fill="#172033"/><text x="72" y="316">O=(0,0,0)</text><text x="165" y="280">Q=(0,1,0)</text><text x="280" y="340" text-anchor="middle" font-size="12">Schematic oblique view; the common perpendicular joins L to M.</text></svg>